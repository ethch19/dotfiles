unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# new windows: pick a layout. "plain" is the old behaviour, one key away.
unbind c
bind c display-menu -T 'new window' \
	'plain' 'p' 'new-window' \
	'coding   yazi|vim|bash' '1' 'new-window -n coding "~/.tmux-workflow coding"' \
	'stacked  vim on top' '2' 'new-window -n stack "~/.tmux-workflow stacked"'

#Binds "r" to reload tmuxconf
bind r source-file ~/.tmux.conf

#M = Meta, aka Alt
# arrows move between panes, as before; shift+arrow nudges the border by 2 cells
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n M-S-Left resize-pane -L 2
bind -n M-S-Right resize-pane -R 2
bind -n M-S-Up resize-pane -U 1
bind -n M-S-Down resize-pane -D 1

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind Tab last-window

# floating shell over the current pane, gone again on exit
bind w display-popup -E -w 80% -h 80% -d '#{pane_current_path}' 'exec ${SHELL:-bash} -l'

set -g default-terminal "tmux-256color"

# ── behaviour ────────────────────────────────────────────────────────────────
set -g mouse on
# how long tmux waits for the rest of an escape sequence: high values make <Esc>
# and <C-[> feel stuck in vim; 0 breaks slow links, 10ms is the safe floor
set -g escape-time 10
# windows and panes count from 1, and stay contiguous when one is closed
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
# tmux forwards OSC 52 to the outer terminal, and apps can set the clipboard
set -g set-clipboard on
# yazi/pager image previews reach the terminal instead of dying in tmux
set -g allow-passthrough on

# pane dividers in the powerline palette: quiet navy when idle, the status bar's
# blue (#209be3, @c_blue) on the pane that has focus; swap to #e35b12 (@c_orange)
# for the orange it uses when a prefix is armed
set -g pane-border-style 'fg=#2a3352'
set -g pane-active-border-style 'fg=#209be3'

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @yank_selection 'clipboard'
set -g @yank_selection_mouse 'clipboard'

set -g @resurrect-processes 'nvim vim man less more tail top htop'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.tmux/plugins/tpm/tpm'

# ── status bar ───────────────────────────────────────────────────────────────
# Windows Terminal does 24-bit colour, tmux only knows that once it is told.
# `set -a` on an array option appends again on every reload, hence the guard.
%if #{!=:#{@status_bar_init},1}
set -as terminal-features ",gnome*:RGB"
set -as terminal-features ",xterm*:RGB"
set -g @status_bar_init 1
%endif

# Palette from ethch.omp.toml, so the bar and the shell prompt agree.
set -g @c_bg '#161e38'
set -g @c_orange '#e35b12'
set -g @c_blue '#209be3'
set -g @c_text '#e9edf5'
set -g @c_dim '#77839f'

# Powerline hard divider (U+E0B0). Every use is fg = colour we leave,
# bg = colour we enter, which is what keeps the arrows aligned and matching.
# Written with printf because the glyph itself is in the private use area.
run-shell 'tmux set -g @arrow "$(printf "\356\202\260")"'

set -g status-interval 2
set -g status-left-length 40
set -g status-right-length 120
set -g status-style "fg=#{@c_text},bg=#{@c_bg}"
set -g window-status-separator ''

# session, in its own block; goes blue while the prefix key is held down
set -g status-left "#{?client_prefix,#[fg=#{@c_text}]#[bg=#{@c_blue}],#[fg=#{@c_text}]#[bg=#{@c_orange}]}#[bold]  #{session_name} #{?client_prefix,#[fg=#{@c_blue}],#[fg=#{@c_orange}]}#[bg=#{@c_bg}]#[nobold]#{@arrow}"

# windows: the current one sits in a block, the rest stay flat on the bar
set -g window-status-format "#[fg=#{@c_dim},bg=#{@c_bg}] #{window_index}:#{window_name} "
set -g window-status-current-format "#[fg=#{@c_bg},bg=#{@c_blue}]#{@arrow}#[fg=#{@c_text},bg=#{@c_blue}]#[bold] #{window_index}:#{window_name} #[fg=#{@c_blue},bg=#{@c_bg}]#[nobold]#{@arrow}"

# load, CPU, network, then the clock in a block closing the bar
set -g status-right "#[fg=#{@c_dim},bg=#{@c_bg}]  LOAD #[fg=#{@c_text}]#(cut -d' ' -f1 /proc/loadavg)#[fg=#{@c_dim}]  CPU #[fg=#{@c_text}]#(~/.tmux-status cpu)#[fg=#{@c_dim}]  NET #[fg=#{@c_text}]#(~/.tmux-status net)#[fg=#{@c_bg},bg=#{@c_blue}]#{@arrow}#[fg=#{@c_text},bg=#{@c_blue}]#[bold]  #(date '+%d-%b %H:%M') "
