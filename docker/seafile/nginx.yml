services:
  nginx:
    image: nginx:latest
    container_name: seafile-nginx
    ports:
      - "8080:80"
    volumes:
      #- certbot_etc:/etc/letsencrypt:ro
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /root/docker/seafile-nginx/logs:/var/log/nginx
      #- ./ssl-dhparams.pem:/ssl-dhparams.pem
    depends_on:
      seafile:
        condition: service_started
    # certbot:
    #  condition: service_started
    networks:
      - seafile-net
    restart: unless-stopped

      #certbot:
