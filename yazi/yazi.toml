# yazi lives in the 10%-wide strip of the tmux-workflow coding layout, which is
# ~20 cells. The default three columns (parent | current | preview) get squashed
# into ~6 cells each and every name comes out ellipsised, so keep one column and
# give it the whole width. Dotfiles are what this tree is usually for: show them.
[mgr]
ratio = [0, 1, 0]
show_hidden = true

# Enter on a file hands it to the editor pane of the tmux window instead of
# spawning $EDITOR inside this 20-column strip.
[opener]
edit = [
	{ run = '~/.tmux-workflow edit %s', desc = "edit in the tmux editor pane", for = "unix" },
]
